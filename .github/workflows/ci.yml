name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: jantok_test
          POSTGRES_USER: jantok
          POSTGRES_PASSWORD: jantok_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jantok -d jantok_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: jantok-backend
    env:
      APP_ENV: test
      DATABASE_URL: postgresql://jantok:jantok_ci_only@localhost:5432/jantok_test?schema=public
      REDIS_URL: redis://localhost:6379/0
      S3_ENDPOINT: http://localhost:9000
      S3_BUCKET: jantok-ci
      S3_ACCESS_KEY_ID: ci-only
      S3_SECRET_ACCESS_KEY: ci-only-secret
      JWT_ACCESS_SECRET: ci-access-secret-with-at-least-32-characters
      JWT_REFRESH_SECRET: ci-refresh-secret-with-at-least-32-characters
      SESSION_SECRET: ci-session-secret-with-at-least-32-characters
      OTP_HASH_SECRET: ci-otp-hash-secret-with-at-least-32-characters
      PII_ENCRYPTION_KEY: 000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f
      OTP_PROVIDER_MODE: local
      OTP_LOCAL_ALLOWED_PHONES: +77000000001,+77000000003
      OTP_DEV_INBOX_TOKEN: ci-dev-inbox-token
      LOCAL_DEMO_ADMIN_PHONES: +77000000003,+77000000004
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: jantok-backend/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm run prisma:validate
      - run: npm run prisma:generate
      - run: npm run db:migrate:deploy
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:e2e
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: |
            jantok-backend/dist
            jantok-backend/prisma/migrations
          if-no-files-found: error

  admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jantok-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: jantok-admin/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: admin-production-build
          path: |
            jantok-admin/.next/standalone
            jantok-admin/.next/static
          if-no-files-found: error

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jantok-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug --flavor dev --target-platform android-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: jantok-debug-apk-and-goldens
          path: |
            jantok-mobile/build/app/outputs/flutter-apk/app-dev-debug.apk
            jantok-mobile/output/stage8/*.png
          if-no-files-found: error

  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose --env-file .env.staging.example -f compose.yaml -f compose.staging.yaml config --quiet

  acceptance:
    needs: [backend, admin, mobile, infrastructure]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - run: cp .env.example .env
      - run: ./scripts/verify-stage10.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage10-acceptance-evidence
          path: output/stage10
          if-no-files-found: error
